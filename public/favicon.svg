<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc" />
      <stop offset="1" stop-color="#a5b4fc" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.7" />

  <!-- Sun -->
